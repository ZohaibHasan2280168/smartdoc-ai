apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: smartdoc-ai
data:
  PROJECT_NAME: "SmartDoc AI Backend"
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://postgres:SmartDoc2026Secure!@smartdoc-db.cu7qimoo0rm4.us-east-1.rds.amazonaws.com:5432/smartdoc"
  REDIS_URL: "redis://redis.smartdoc-ai.svc.cluster.local:6379/0"
  CORS_ORIGINS: "*"
  OPENAI_MODEL: "gpt-3.5-turbo"
  S3_BUCKET_NAME: "smartdoc-storage-zohaib-2026"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: smartdoc-ai
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartdoc-ai
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: 479537131188.dkr.ecr.us-east-1.amazonaws.com/smartdoc-backend:sha-d2fc273
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smartdoc-ai
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend
