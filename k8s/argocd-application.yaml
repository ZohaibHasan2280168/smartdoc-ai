apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartdoc-ai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ZohaibHasan2280168/smartdoc-ai.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: smartdoc-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
